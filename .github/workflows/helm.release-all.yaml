name: Helm - Release All

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.helm/charts/**'

jobs:
  release-all:
    uses: jnnkrdb/helm-charts/.github/workflows/workflow.release-all.yaml@main
    with:
      chart-test-yaml: .helm/ct.yaml
      registry: ghcr.io
      registry-username: ${{ github.actor }}
      registry-repopath: ${{ github.repository_owner }}/helm-r8r
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
