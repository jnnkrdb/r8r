name: Helm - Release All

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.helm/**'

jobs:
  release-all:
    uses: jnnkrdb/helm-charts/.github/workflows/workflow.release-all.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      chart-test-yaml: .helm/ct.yaml
      registry: ghcr.io
      registry-username: ${{ github.actor }}
      registry-repopath: ${{ github.repository_owner }}/r8r-helm
    secrets:
      registry-password: ${{ secrets.GHP_TOKEN }}