{{- $v := .Values -}}
{{- $global := $v.global -}}
{{- $main := $v -}}
{{- $rbac := $v.rbac -}}

{{ if not (empty $rbac.rules) -}}
--- # --------------------------------------------------------------------------------- ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "common.fullname" . }}-additional
  labels:
    {{- include "common.defaultLabels" . | nindent 4 }}
    {{- include "common.keyValues" ( 
        dict "kvs" ( list $global.labels 
                          $main.labels ) ) | nindent 4 }}
  annotations:
    {{- include "common.keyValues" ( 
        dict "kvs" ( list $global.annotations 
                          $main.annotations ) ) | nindent 4 }}
rules:
  {{- with $rbac.rules }}
  {{- . | toYaml | nindent 2 }}
  {{- end }}
{{- end -}}